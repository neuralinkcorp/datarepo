# Neuralink Code Review Bot
#
# Runs on the default branch when CI is requested (including after a
# maintainer approves fork workflows) so the review is parallel with tests.
# Checks out this repository's default branch only — never PR code.
# Secrets are available on workflow_run; they are not on pull_request from forks.
#
# Does not use pull_request_target.
name: Neuralink Code Review Bot

on:
  workflow_run:
    workflows:
      - Test, Build and Publish datarepo
    types:
      - requested

concurrency:
  group: neuralink-code-review-bot-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  review:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check review bot configuration
        id: cfg
        env:
          APP_ID: ${{ vars.REVIEW_BOT_APP_ID }}
          APP_ID_SECRET: ${{ secrets.REVIEW_BOT_APP_ID }}
          APP_KEY: ${{ secrets.REVIEW_BOT_APP_PRIVATE_KEY }}
          XAI_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          APP_ID_VALUE="${APP_ID:-$APP_ID_SECRET}"
          if [ -n "$APP_ID_VALUE" ] && [ -n "$APP_KEY" ] && [ -n "$XAI_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Neuralink Code Review Bot: set REVIEW_BOT_APP_ID, REVIEW_BOT_APP_PRIVATE_KEY, and XAI_API_KEY."
          fi

      - name: Create GitHub App token
        if: steps.cfg.outputs.configured == 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REVIEW_BOT_APP_ID || secrets.REVIEW_BOT_APP_ID }}
          private-key: ${{ secrets.REVIEW_BOT_APP_PRIVATE_KEY }}

      - name: Review pull request
        if: steps.cfg.outputs.configured == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: grok-4.6
        run: python3 .github/scripts/grok_review.py
